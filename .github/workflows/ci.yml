name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Backend tests (Java 21, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend tests and build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

  docker:
    name: Docker image builds and serves the app
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t salary-management .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8080 --name app salary-management
          for i in $(seq 1 60); do curl -fs localhost:8080/api/insights/overview && break; sleep 2; done
          curl -fs localhost:8080/api/insights/overview | grep '"headcount":10000'
          curl -fs localhost:8080/ | grep -q 'ACME Salary Management'
          curl -fs -o /dev/null localhost:8080/insights

  package:
    name: Package single runnable jar (API + UI)
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/src/main/resources/static
      - name: Build jar
        run: mvn -B -ntp -DskipTests package
        working-directory: backend
      - name: Publish jar to the "build-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-latest >/dev/null 2>&1 || \
            gh release create build-latest --prerelease --title "Latest build" \
              --notes "Runnable jar built from main by CI. Run: java -jar salary-management.jar"
          gh release upload build-latest backend/target/salary-management.jar --clobber
