spring.application.name=salary-management
server.port=${PORT:8080}

# SQLite file database (created on first start). Override with SALARY_DB_PATH.
spring.datasource.url=jdbc:sqlite:${SALARY_DB_PATH:salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# Seed 10,000 employees on first start when the table is empty.
app.seed.enabled=true
app.seed.count=10000
